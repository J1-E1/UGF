<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .t{font-weight:600;font-size:13px;fill:#1f2328}
    .s{font-size:11px;fill:#57606a}
    .blk{font-weight:600;font-size:10.5px;fill:#0969da}
    .box{fill:#f6f8fa;stroke:#afb8c1;stroke-width:1.4}
    .accent{stroke:#0969da;stroke-width:1.8}
    .ln{stroke:#afb8c1;stroke-width:1.6;fill:none}
    .edge{font-size:10.5px;fill:#57606a}
  </style>
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M1,1 L9,5.5 L1,10" fill="none" stroke="#afb8c1" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="60" width="150" height="74" rx="9"/>
  <text class="t" x="95" y="88" text-anchor="middle">Houdini cook</text>
  <text class="s" x="95" y="106" text-anchor="middle">HDA 出体素</text>
  <text class="blk" x="95" y="124" text-anchor="middle">▷ 第6块 翻译器</text>

  <rect class="box" x="196" y="60" width="158" height="74" rx="9"/>
  <text class="t" x="275" y="84" text-anchor="middle">共享编辑层栈</text>
  <text class="s" x="275" y="101" text-anchor="middle">ULandscapeInfo</text>
  <text class="s" x="275" y="116" text-anchor="middle">.EditLayers (additive)</text>
  <text class="blk" x="275" y="131" text-anchor="middle">▷ 第2块 编辑层</text>

  <rect class="box" x="380" y="60" width="150" height="74" rx="9"/>
  <text class="t" x="455" y="84" text-anchor="middle">分区建 proxy</text>
  <text class="s" x="455" y="101" text-anchor="middle">RebuildStreaming-</text>
  <text class="s" x="455" y="115" text-anchor="middle">Proxies · grid²</text>
  <text class="blk" x="455" y="131" text-anchor="middle">▷ 第3块 分区</text>

  <rect class="box accent" x="556" y="60" width="168" height="74" rx="9"/>
  <text class="t" x="640" y="84" text-anchor="middle">每块各混各区域</text>
  <text class="s" x="640" y="101" text-anchor="middle">BlendTerrain + _LayerST</text>
  <text class="s" x="640" y="115" text-anchor="middle">精确 UV 防接缝</text>
  <text class="blk" x="640" y="131" text-anchor="middle">▷ 第2·4块 混合/接缝</text>

  <rect class="box" x="750" y="60" width="130" height="74" rx="9"/>
  <text class="t" x="815" y="88" text-anchor="middle">写回 Terrain</text>
  <text class="s" x="815" y="106" text-anchor="middle">SetHeights · Y-flip</text>
  <text class="blk" x="815" y="124" text-anchor="middle">▷ 第7块 写回</text>

  <path class="ln" d="M170,97 L194,97" marker-end="url(#a)"/>
  <path class="ln" d="M354,97 L378,97" marker-end="url(#a)"/>
  <path class="ln" d="M530,97 L554,97" marker-end="url(#a)"/>
  <path class="ln" d="M724,97 L748,97" marker-end="url(#a)"/>

  <rect class="box" x="556" y="250" width="168" height="58" rx="9"/>
  <text class="t" x="640" y="276" text-anchor="middle">各 proxy 持有自己的瓦片</text>
  <text class="s" x="640" y="294" text-anchor="middle">分布式 · 无 master</text>
  <path class="ln" d="M640,134 L640,248" marker-end="url(#a)"/>
  <text class="edge" x="652" y="200">渲染结果落到各块</text>

  <rect class="box" x="300" y="370" width="200" height="66" rx="9"/>
  <text class="t" x="400" y="396" text-anchor="middle">运行时流式 load/unload</text>
  <text class="s" x="400" y="413" text-anchor="middle">UpdateStreaming · 相机距离</text>
  <text class="blk" x="400" y="429" text-anchor="middle">▷ 第5块 流式</text>

  <rect class="box" x="556" y="370" width="200" height="66" rx="9"/>
  <text class="t" x="656" y="396" text-anchor="middle">逐块烘焙资产</text>
  <text class="s" x="656" y="413" text-anchor="middle">每块一个 TerrainData (OFPA 式)</text>
  <text class="blk" x="656" y="429" text-anchor="middle">▷ 第7块 烘焙</text>

  <path class="ln" d="M600,308 L430,368" marker-end="url(#a)"/>
  <path class="ln" d="M656,308 L656,368" marker-end="url(#a)"/>
</svg>
